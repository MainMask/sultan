{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>{{ title }}</h5></div>
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small mt-1">{% for e in field.errors %}{{ e }}{% endfor %}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-warning"><i class="bi bi-check-circle me-1"></i>Сохранить</button>
                <a href="{% url 'trainer_list' %}" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
