{% extends 'base.html' %}
{% block title %}Удаление группы{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5">
<div class="card border-danger">
    <div class="card-header bg-danger text-white"><h5 class="mb-0">Удаление группы</h5></div>
    <div class="card-body">
        <p>Удалить группу <strong>{{ group.name }}</strong>?</p>
        <div class="d-flex gap-2">
            <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Удалить</button></form>
            <a href="{% url 'group_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </div>
</div>
</div></div>
{% endblock %}
